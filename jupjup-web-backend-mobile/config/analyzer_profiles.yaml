# T25 로컬 분석기 프로필 (설계: specs/design_local_analyzer.md 6.2절)
#
# T25b(런타임·모델 스파이크)가 `models:` 블록을 채웠다. 측정 근거: specs/phase2_t25b_spike_report.md
# - 확인일: 2026-11-02. revision은 Hugging Face commit hash, sha256은 최종 GGUF 파일의 sha256이다.
# - 공식 GGUF가 있는 모델(EXAONE 3.5 2.4B, Qwen2.5 3B/7B)은 공식 GGUF 파일 그대로다 (HF LFS oid와 일치 확인).
# - 공식 GGUF가 없는 모델(Qwen3-4B-Instruct-2507, Kanana-1.5 2.1B/8B)은 공식 safetensors(아래 repo@revision)를
#   llama-cpp-python 0.3.36 sdist에 들어 있는 llama.cpp의 convert_hf_to_gguf.py → llama_model_quantize(Q4_K_M)로
#   직접 변환했다 (scripts/spikes/convert_quantize.py). 이 세 모델의 `filename`은 HF 저장소에 없는 **로컬 변환 결과물**
#   이름이다. 이 세 모델은 `source: local_convert`로 표시하고, `jupjup models pull`은 받지 않고 안내만 한다
#   (배포 경로는 PM·사용자 결정 사항. specs/phase2_t25d_report.md "남은 문제").
# - 모델 가중치는 저장소에 커밋하지 않는다. 캐시 경로는 JUPJUP_ANALYZER_CACHE_DIR(설계 3.4절)로 전달한다.
#   파일 위치: <cache>/gguf/<model_id>/<filename>
# - measured_p50_s: T25b 실측 건당 p50(초, 문법 제약 single. Qwen3-4B·Kanana-2.1B는 제어 문자 패치 문법 재측정값).
#   예상 소요 시간 출력(`analyze record`, `eval ingest --mode live`, `bench analyze`)에만 쓴다. 녹화 키와 무관하다.
# - 로더: jupjup.ingest.profiles.AnalyzerProfiles.load (참조 무결성 검사 포함). 점검: `jupjup models doctor`

[project]
name = "jupjup"
version = "0.1.0"
description = "줍줍저장소 자연어 검색 코어"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0,<2.1",
    "kiwipiepy==0.21.0",
    "numpy>=2.0,<3",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.23,<5",
    "typer>=0.12,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=5.1,<6",
]
rerank = [
    "sentence-transformers>=5.1,<6",
]
# 로컬 분석 모델 런타임 (설계 design_local_analyzer.md 3.3절). PyPI sdist 소스 빌드로 설치한다 (Metal은 Apple
# Silicon 기본값). 0.3.36 고정 근거와 Metal wheel 인덱스를 쓰지 않는 이유: specs/phase2_t25b_spike_report.md 2절.
analyze-local = [
    "llama-cpp-python==0.3.36",
    "huggingface-hub>=0.26,<2",
]
assist-local = [
    "jupjup[analyze-local]",
]
local-models = [
    "jupjup[embed,rerank,analyze-local]",
]

[project.scripts]
jupjup = "jupjup.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-jsonschema",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jupjup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "embed: bge-m3 integration tests (requires the embed extra and model download)",
    "rerank: bge-reranker-v2-m3 integration tests (requires the rerank extra and model download)",
    "eval: golden-set regression (mock, fast)",
    "local_llm: real GGUF model test (requires the analyze-local extra and JUPJUP_ANALYZER_CACHE_DIR)",
]
addopts = "-q -m 'not embed and not rerank and not local_llm'"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 한글/전각 문자 혼동 경고는 의도된 사용

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["jupjup"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["kiwipiepy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["llama_cpp.*", "huggingface_hub.*"]
ignore_missing_imports = true
